name: part1-ci

# Часть 1: сборка обязана стать зелёной. Каждая джоба — отдельная проверка,
# команды совпадают с ./scripts/check-part1.sh.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: part1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Форматирование (ruff format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: ./scripts/setup.sh --check
      - name: ruff format --check
        run: uv run ruff format --check .

  lint:
    name: Линт (ruff check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: ./scripts/setup.sh --check
      - name: ruff check
        run: uv run ruff check --output-format=github .

  types:
    name: Типы (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: ./scripts/setup.sh --check
      - name: mypy
        run: uv run mypy src tests

  tests:
    name: Тесты (pytest, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen
      - run: ./scripts/setup.sh --check
      - name: pytest (тесты части 1)
        # Полный набор, включая часть 2, проверяет джоба tests в part2-ci.yml.
        run: >-
          uv run pytest -v
          tests/test_money.py
          tests/test_inventory.py
          tests/test_reporting.py
      - name: отчёт о покрытии
        if: matrix.python-version == '3.12'
        run: uv run coverage report
